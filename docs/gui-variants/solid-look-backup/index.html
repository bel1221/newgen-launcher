<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Newgen Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background layer: the only thing behind the GUI. renderer.js fills it with the videos
       from assets/videos/ (see README "Background video"). -->
  <div id="bg"></div>

  <!-- Login view: the in-game LOG IN book -->
  <main id="login-view" class="book">
    <h1 class="plaque">Log in</h1>
    <form id="login-form" class="page">
      <img class="logo" src="assets/lockup.png" alt="NewGen">
      <label>Account <input id="username" autocomplete="username" maxlength="16" spellcheck="false" required></label>
      <label id="password-row" class="accent">Password <input id="password" type="password" autocomplete="current-password"></label>
      <button type="submit" id="login-btn">Log in</button>
    </form>
    <div class="page">
      <p class="welcome">Welcome to NewGen!</p>
      <p>Type your account name and password on the left page, then press Log in.</p>
      <p id="offline-note" class="hidden">Offline dev mode: password is not checked.</p>
      <p id="login-error" class="error" role="alert"></p>
    </div>
  </main>

  <!-- Play view: the in-game tan panel -->
  <main id="play-view" class="panel hidden">
    <h1 class="plaque">Launcher</h1>
    <img class="logo" src="assets/lockup.png" alt="NewGen">
    <div class="row">
      <p class="slot">Logged in as <strong id="player-name"></strong></p>
      <button id="logout-btn">Log out</button>
    </div>
    <button id="play-btn" class="play">Play</button>
    <div class="card">
      <p id="status">Ready</p>
      <progress id="progress" value="0" max="1"></progress>
    </div>
    <p id="play-error" class="error" role="alert"></p>
    <details open>
      <summary>Game log</summary>
      <pre id="log" class="card"></pre>
    </details>
  </main>

  <!-- Window shell: the top strip drags the window and holds the window buttons
       (wired in renderer.js -> preload.js -> main.js). The footer text is set in renderer.js. -->
  <header id="titlebar">
    <button id="win-min" type="button" aria-label="Minimize" title="Minimize"></button>
    <button id="win-close" type="button" aria-label="Close" title="Close"></button>
  </header>
  <!-- Link buttons, bottom left. The addresses are set in config.json ("links"); renderer.js shows
       a button only if its link is set. The icons are plain pixel glyphs (speech bubble, globe). -->
  <div id="links">
    <button type="button" class="hidden" data-link="discord">
      <svg viewBox="0 0 9 7" aria-hidden="true"><path d="M1 0h7v1H1zM0 1h9v3H0zM1 4h7v1H1zM2 5h2v1H2zM2 6h1v1H2zM2 2v1h1V2zM4 2v1h1V2zM6 2v1h1V2z"/></svg>Discord
    </button>
    <button type="button" class="hidden" data-link="website">
      <svg viewBox="0 0 7 7" aria-hidden="true"><path d="M2 0h3v1H2zM2 6h3v1H2zM0 2h1v3H0zM6 2h1v3H6zM2 1h1v5H2zM4 1h1v5H4zM0 3h7v1H0zM1 1h1v1H1zM5 1h1v1H5zM1 5h1v1H1zM5 5h1v1H5z"/></svg>Website
    </button>
  </div>
  <footer id="footer"></footer>

  <script type="module" src="burst.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
