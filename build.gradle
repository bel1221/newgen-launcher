plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	mavenCentral()
	// Player Animation Library (MIT)
	maven { url = "https://repo.redlance.org/public" }
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"newgen_client" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JCodec (BSD 2-clause): pure-Java H.264 decoder for the title screen background; nested in the mod jar.
	implementation "org.jcodec:jcodec:0.2.5"
	include "org.jcodec:jcodec:0.2.5"

	// Player Animation Library (MIT): plays the emotes on the player model; nested in the mod jar (it carries its core).
	modImplementation "com.zigythebird.playeranim:PlayerAnimationLibFabric:1.1.12+mc.1.21.11"
	include "com.zigythebird.playeranim:PlayerAnimationLibFabric:1.1.12+mc.1.21.11"
	// Bendable Cuboids (MIT, by the same authors): draws the elbow, knee and waist bends PAL computes
	modImplementation "com.zigythebird.bendable_cuboids:BendableCuboidsFabric:2.0.1+mc.1.21.11"
	include "com.zigythebird.bendable_cuboids:BendableCuboidsFabric:2.0.1+mc.1.21.11"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// The emote test reads the client code's emote loader and the bundled emote files.
sourceSets.test {
	compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
	runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
}

test {
	useJUnitPlatform()
}
